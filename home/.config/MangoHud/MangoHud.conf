### MangoHud — tema "Shadow Materia"
### Mostrar/esconder: Shift direito + F12 · Ativar num jogo: mangohud %command%

################ LAYOUT ################
legacy_layout=false
position=top-left
offset_x=12
offset_y=12
round_corners=8
background_alpha=0.55
background_color=150A0A
font_file=/usr/share/fonts/TTF/GoogleSansCode[MONO,wght].ttf
font_size=20
text_color=F0EDEE
text_outline
text_outline_thickness=1.5
table_columns=5
width=500

################ GPU ################
# nomes fixos da giratina (MangoHud não aceita comando nos rótulos)
gpu_stats
gpu_text=RX 9050
gpu_color=F28B82
gpu_load_change
gpu_load_value=60,90
gpu_load_color=78CA9F,F2DA66,F28B82
gpu_temp
gpu_core_clock
gpu_power
vram
vram_color=F28B82

################ CPU ################
cpu_stats
cpu_text=2680 v4
cpu_color=8AB8F0
cpu_load_change
cpu_load_value=60,90
cpu_load_color=78CA9F,F2DA66,F28B82
cpu_temp
cpu_mhz
ram
ram_color=8AB8F0

################ FPS ################
fps
fps_color_change
fps_value=60,90
fps_color=F28B82,F2DA66,78CA9F
fps_metrics=avg,0.01
engine_color=919093
frametime
frametime_color=F2DA66
frame_timing

################ TECLAS ################
toggle_hud=Shift_R+F12
toggle_logging=Shift_L+F2
output_folder=/home/shadow/Documentos/mangohud-logs
