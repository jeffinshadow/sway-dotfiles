# Cancelamento de eco (WebRTC) pro microfone da giratina — instância separada do PipeWire
# (giratina-aec.service), sem mexer no áudio principal. Referência = o que toca na saída
# padrão (JBL), via monitor.mode; cria a fonte "giratina_aec_source" (FIFINE sem o som da caixa).
# Não vira o microfone padrão (prioridade baixa): só o giratina-voz usa.
context.properties = {
    log.level = 0
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt          flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-echo-cancel
        args = {
            library.name  = aec/libspa-aec-webrtc
            monitor.mode  = true
            node.latency  = 1024/48000
            audio.channels = 1
            audio.position = [ MONO ]
            aec.args = {
                webrtc.extended_filter    = true
                webrtc.delay_agnostic     = true
                webrtc.noise_suppression  = true
                webrtc.high_pass_filter   = true
                webrtc.gain_control       = true      # nível estável pro reconhecedor (o FIFINE cru é baixo)
            }
            capture.props = {
                node.name     = "giratina_aec_capture"
                target.object = "alsa_input.usb-3142_FIFINE_Microphone-00.mono-fallback"
                node.passive  = true
                node.dont-move = true                 # o Easy Effects não puxa pra fonte dele
                application.name = "giratina-aec"
            }
            source.props = {
                node.name        = "giratina_aec_source"
                node.description = "Microfone sem eco (giratina)"
                priority.session = 1
                priority.driver  = 1
            }
        }
    }
]
