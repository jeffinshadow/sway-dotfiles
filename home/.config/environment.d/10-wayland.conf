# Variáveis da sessão. Lidas pelo systemd --user (apps ativados por D-Bus)
# e pelo ~/.profile (sessão iniciada pelo greetd/TTY).

# GTK: Wayland nativo, X11 só como reserva
GDK_BACKEND="wayland,x11"
# Qt: Wayland nativo, tema via qt6ct (paleta Shadow Materia)
QT_QPA_PLATFORM="wayland;xcb"
QT_QPA_PLATFORMTHEME="qt6ct"
QT_WAYLAND_DISABLE_WINDOWDECORATION="1"
# Electron/Chromium em Wayland
ELECTRON_OZONE_PLATFORM_HINT="auto"
# Apps Java (consoles iDRAC/iLO/IPMI, etc.) sem janela cinza no sway
_JAVA_AWT_WM_NONREPARENTING="1"
# LibreOffice com a interface GTK
SAL_USE_VCLPLUGIN="gtk3"
# Cursor
XCURSOR_THEME="Bibata-Modern-Ice"
XCURSOR_SIZE="24"
# Agente SSH do gnome-keyring (gcr-ssh-agent.socket)
SSH_AUTH_SOCK="${XDG_RUNTIME_DIR}/gcr/ssh"
EDITOR="vim"
