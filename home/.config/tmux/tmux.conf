# ~/.config/tmux/tmux.conf — Shadow Materia
#
# Prefixo padrão (Ctrl+b), pra memória valer em qualquer servidor.
#   Ctrl+b d       desanexa (a sessão continua rodando)
#   Ctrl+b c / n   nova janela / próxima
#   Ctrl+b " / %   divide embaixo / ao lado (na pasta atual)
#   Ctrl+b [       rolar/copiar (q sai)
# No SSH o zsh já abre/reanexa a sessão "main" sozinho.

# Terminal e cores (Ghostty e afins: true color)
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"

set -g mouse on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on
# Copiar no tmux vai pro clipboard do PC de onde veio o SSH (OSC 52)
set -g set-clipboard on

# Janelas e painéis contam a partir de 1 (igual às workspaces do sway)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Divisões e janelas novas abrem na pasta atual
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window -c "#{pane_current_path}"
bind r   source-file ~/.config/tmux/tmux.conf \; display "tmux.conf recarregado"

# Título da aba do terminal: host + janela
set -g set-titles on
set -g set-titles-string "#h · #W"

# ---------------------------------------------------------------
# Visual (paleta Shadow Materia)
# ---------------------------------------------------------------
set -g status-position bottom
set -g status-style "bg=#181818,fg=#dedede"
set -g status-left-length 30
set -g status-left "#[bg=#5294e2,fg=#181818,bold] #S #[bg=#181818] "
set -g status-right "#[fg=#999999]#h  #[fg=#dedede]%H:%M "
setw -g window-status-format "#[fg=#999999] #I #W "
setw -g window-status-current-format "#[bg=#282828,fg=#8ab4f8,bold] #I #W "
setw -g window-status-separator ""
set -g pane-border-style "fg=#333333"
set -g pane-active-border-style "fg=#5294e2"
set -g message-style "bg=#282828,fg=#8ab4f8"
setw -g mode-style "bg=#5294e2,fg=#181818"
