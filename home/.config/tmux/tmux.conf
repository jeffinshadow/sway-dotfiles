# ~/.config/tmux/tmux.conf — Shadow Materia
#
# Prefixo padrão (Ctrl+b), pra memória valer em qualquer servidor.
#   Ctrl+b d       desanexa (a sessão continua rodando)
#   Ctrl+b c / n   nova janela / próxima
#   Ctrl+b " / %   divide embaixo / ao lado (na pasta atual)
#   Ctrl+b [       rolar/copiar (q sai)
# No SSH o zsh já abre/reanexa a sessão "main" sozinho.

# Terminal e cores (Ghostty e afins: true color)
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"

set -g mouse on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on
# Copiar no tmux vai pro clipboard do PC de onde veio o SSH (OSC 52)
set -g set-clipboard on

# Janelas e painéis contam a partir de 1 (igual às workspaces do sway)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Divisões e janelas novas abrem na pasta atual
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window -c "#{pane_current_path}"
bind r   source-file ~/.config/tmux/tmux.conf \; display "tmux.conf recarregado"

# Título da aba do terminal: host + janela
set -g set-titles on
set -g set-titles-string "#h · #W"

# ---------------------------------------------------------------
# Visual (paleta Shadow Materia, híbrida M3)
# ---------------------------------------------------------------
set -g status-position bottom
set -g status-style "bg=#131314,fg=#F0EDEE"
set -g status-left-length 30
# Dragão da shadowtec (U+100000, fonte ShadowTec Symbols) antes da sessão
set -g status-left "#[bg=#5294E2,fg=#0B0D10,bold] 􀀀 #S #[bg=#131314] "
set -g status-right "#[fg=#919093]#h  #[fg=#F0EDEE]%H:%M "
setw -g window-status-format "#[fg=#919093] #I #W "
setw -g window-status-current-format "#[bg=#222324,fg=#8AB8F0,bold] #I #W "
setw -g window-status-separator ""
set -g pane-border-style "fg=#323235"
set -g pane-active-border-style "fg=#5294E2"
set -g message-style "bg=#222324,fg=#8AB8F0"
setw -g mode-style "bg=#5294E2,fg=#0B0D10"
