<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Shadow Materia: Google Sans (UI) + Google Sans Code NF (mono).
     Se faltar algum glyph, cai em Inter/Noto e no Symbols Nerd Font. -->
<fontconfig>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Google Sans</family>
      <family>Inter</family>
      <family>Noto Sans</family>
      <family>Symbols Nerd Font</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>Google Sans Code NF</family>
      <family>Symbols Nerd Font Mono</family>
      <family>Noto Sans Mono</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>Google Sans Code NF</family>
    <accept><family>Symbols Nerd Font Mono</family></accept>
  </alias>

  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting"   mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba"      mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
</fontconfig>
