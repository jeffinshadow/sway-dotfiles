"$schema" = 'https://starship.rs/config-schema.json'
add_newline = true
palette = "shadow_materia"

# uma linha: capsulas -> digita na sequencia (homenagem ao prompt de 2023)
format = "[](azul)$os$username$hostname[](bg:superficie fg:azul)$directory$git_branch$git_status$status$character"

right_format = "$cmd_duration$time"

[palettes.shadow_materia]
fundo = "#131314"
superficie = "#222324"
azul = "#5294E2"
azul_claro = "#8AB8F0"
verde = "#78CA9F"
vermelho = "#F28B82"
ambar = "#F2DA66"
roxo = "#B98EFF"
cinza = "#919093"
texto = "#F0EDEE"

[os]
disabled = false
format = "[ $symbol ]($style)"
style = "bg:azul fg:texto"

# Dragão da shadowtec: glyph U+100000 da fonte ShadowTec Symbols
# (home/.local/share/fonts). Onde a fonte não existe vira um quadradinho.
[os.symbols]
Arch = "\U00100000"
CachyOS = "\U00100000"   # o padrão do starship é 🎗️

[username]
show_always = true
format = "[$user ]($style)"
style_user = "bg:azul fg:texto bold"
style_root = "bg:vermelho fg:texto bold"

[hostname]
ssh_only = true
format = "[@$hostname ]($style)"
style = "bg:azul fg:texto"

[directory]
format = "[ 󰋜 $path ]($style)"
style = "bg:superficie fg:azul_claro"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"

[git_branch]
format = "[ $symbol$branch ]($style)"
symbol = " "
style = "bg:superficie fg:roxo"

[git_status]
format = "[$all_status$ahead_behind]($style)"
style = "bg:superficie fg:vermelho"

[status]
disabled = false
format = "[ ✘ $status ]($style)"
style = "bg:superficie fg:vermelho"

[character]
success_symbol = "[ ](fg:superficie)"
error_symbol = "[ ](fg:vermelho)"

[cmd_duration]
min_time = 2000
format = "[󱎫 $duration]($style) "
style = "ambar"

[time]
disabled = false
format = "[󰥔 $time]($style)"
style = "cinza"
time_format = "%H:%M"
