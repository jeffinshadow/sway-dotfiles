# Dispositivos de áudio desativados (giratina; na latios não casam com nada):
#  - saída HDMI/DP da RX 9050 (alto-falante do monitor): a saída é sempre a JBL
#  - microfone da webcam: o microfone é sempre o FIFINE
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.pci-0000_09_00.1" }
      { device.name = "~alsa_card.usb-SunplusIT_Inc_FHD_Camera_Microphone.*" }
    ]
    actions = { update-props = { device.disabled = true } }
  }
]
