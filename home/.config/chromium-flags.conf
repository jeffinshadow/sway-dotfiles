--ozone-platform-hint=auto
--enable-features=TouchpadOverscrollHistoryNavigation
# Tema Shadow Materia (extensão de tema em ~/.local/share/chromium-themes).
# O launcher não expande ~ nem $HOME: caminho absoluto (mesmo usuário nas
# duas máquinas). A feature desligada mantém o --load-extension funcionando.
--load-extension=/home/shadow/.local/share/chromium-themes/shadow-materia
--disable-features=DisableLoadExtensionCommandLineSwitch
