# ---------------------------------------------------------------
# Autostart
# ---------------------------------------------------------------
exec /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec mako
exec swayosd-server
exec nm-applet --indicator
exec blueman-applet
exec wl-paste --watch cliphist store
exec gammastep
exec solaar --window=hide
exec xdg-user-dirs-update

# Tema GTK/GTK4 (gtk-settings.sh) é chamado pelo arquivo do host,
# porque a escala de texto muda por máquina.

# Bloqueio e apagar tela (a suspensão automática fica no arquivo do host)
exec swayidle -w \
    timeout 300 'swaylock -f' \
    timeout 330 'swaymsg "output * power off"' resume 'swaymsg "output * power on"' \
    before-sleep 'swaylock -f'
