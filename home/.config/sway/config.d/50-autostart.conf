# ---------------------------------------------------------------
# Autostart
# ---------------------------------------------------------------
exec /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec mako
exec swayosd-server
# Janela nova divide a focada pelo lado maior: 1ª lado a lado, depois
# empilha, alterna (bom pra 16:9; o padrão do sway só faz colunas)
exec autotiling-rs
exec nm-applet --indicator
exec blueman-applet
exec wl-paste --watch cliphist store
exec gammastep
exec solaar --window=hide
exec xdg-user-dirs-update

# Aviso de bateria baixa (só onde há bateria)
exec ~/.config/sway/scripts/bateria.sh

# Avisa se algum arquivo novo do repo de dotfiles ficou sem link (a cada reload)
exec_always ~/.config/sway/scripts/links-check.sh

# Tema GTK/GTK4 (gtk-settings.sh) é chamado pelo arquivo do host,
# porque a escala de texto muda por máquina.

# Não bloqueia nem apaga a tela enquanto toca áudio (reunião, vídeo numa
# janela comum). Pacote do AUR: sem ele instalado, a linha não faz nada.
exec command -v sway-audio-idle-inhibit >/dev/null && sway-audio-idle-inhibit

# Bloqueio e apagar tela (a suspensão automática fica no arquivo do host)
exec swayidle -w \
    timeout 300 'swaylock -f' \
    timeout 330 'swaymsg "output * power off"' resume 'swaymsg "output * power on"' \
    before-sleep 'swaylock -f'
