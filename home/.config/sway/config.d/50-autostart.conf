# ---------------------------------------------------------------
# Autostart
# ---------------------------------------------------------------
exec /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec swaync   # notificações + painel de configurações rápidas (Super+,)
exec swayosd-server
# Layout automático (scripts/layout.py, no lugar do autotiling-rs): janela
# nova divide a focada pelo lado maior (1ª lado a lado, depois empilha,
# alterna). Em tela larga (32" QHD): as três primeiras viram três colunas;
# da quarta em diante divide a coluna em foco.
exec ~/.config/sway/scripts/layout.py
exec nm-applet --indicator
exec blueman-applet
exec wl-paste --watch cliphist store
exec solaar --window=hide
exec xdg-user-dirs-update
# Luz noturna (config em ~/.config/gammastep/config.ini)
exec command -v gammastep >/dev/null && gammastep
# Efeitos de áudio do microfone (preset "Voz": passa-alta, RNNoise, compressor, limitador).
# O Easy Effects lembra o último preset carregado.
exec command -v easyeffects >/dev/null && easyeffects --service-mode --hide-window
# Modo jogo automático: liga quando abre um jogo do Steam, desliga quando fecha
exec ~/.config/sway/scripts/modo-jogo-auto.sh

# Celular (KDE Connect): notificações, área de transferência, arquivos, controle remoto.
# Sem o pacote instalado, a linha não faz nada.
exec command -v kdeconnect-indicator >/dev/null && kdeconnect-indicator

# Aviso de bateria baixa (só onde há bateria)
exec ~/.config/sway/scripts/bateria.sh

# Avisa se algum arquivo novo do repo de dotfiles ficou sem link (a cada reload)
exec_always ~/.config/sway/scripts/links-check.sh

# Tema GTK/GTK4 (gtk-settings.sh) é chamado pelo arquivo do host,
# porque a escala de texto muda por máquina.

# Não bloqueia nem apaga a tela enquanto toca áudio (reunião, vídeo numa
# janela comum). Pacote do AUR: sem ele instalado, a linha não faz nada.
exec command -v sway-audio-idle-inhibit >/dev/null && sway-audio-idle-inhibit

# Bloqueio e apagar tela: idle.sh é o dono do swayidle (pausa por motivo: cafeína do painel,
# modo TV). A suspensão automática fica no arquivo do host.
exec ~/.config/sway/scripts/idle.sh iniciar
