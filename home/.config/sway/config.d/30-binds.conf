# ---------------------------------------------------------------
# Atalhos (mantém a memória muscular do i3 antigo)
#
# Cola de atalhos (clique no logo do Arch na barra, ou Super+F1):
#   #:: Título       → abre uma seção
#   #: Descrição     → documenta o bindsym logo abaixo
#   #: Teclas | Desc → idem, mas mostra "Teclas" no lugar do atalho real
#                      (pra agrupar vários binds numa linha só)
# Atalho sem "#:" não aparece na cola.
# ---------------------------------------------------------------
floating_modifier $mod normal

#:: Apps
#: Terminal (Ghostty)
bindsym $mod+Return exec $term
#: Lançador de apps (rofi)
bindsym $mod+d      exec $menu
#: Alternar entre janelas abertas
bindsym $mod+Tab    exec pkill -x rofi || rofi -show window
#: Arquivos (Nautilus)
bindsym $mod+n      exec $files
#: Navegador (Firefox)
bindsym $mod+b      exec $browser
#: Histórico da área de transferência
bindsym $mod+Shift+v exec $scripts/clipboard.sh
#: Esta lista de atalhos
bindsym $mod+F1     exec $scripts/keybinds.sh

#:: Janelas
#: Fechar janela
bindsym $mod+q       kill
bindsym $mod+Shift+q kill

#: Super + j/k/l/ç ou setas | Mover o foco
bindsym $mod+$left  focus left
bindsym $mod+$down  focus down
bindsym $mod+$up    focus up
bindsym $mod+$right focus right
bindsym $mod+Left   focus left
bindsym $mod+Down   focus down
bindsym $mod+Up     focus up
bindsym $mod+Right  focus right

#: Super + Shift + j/k/l/ç ou setas | Mover a janela
bindsym $mod+Shift+$left  move left
bindsym $mod+Shift+$down  move down
bindsym $mod+Shift+$up    move up
bindsym $mod+Shift+$right move right
bindsym $mod+Shift+Left   move left
bindsym $mod+Shift+Down   move down
bindsym $mod+Shift+Up     move up
bindsym $mod+Shift+Right  move right

#: Tela cheia
bindsym $mod+f fullscreen toggle
#: Flutuante / lado a lado
bindsym $mod+Shift+space floating toggle
#: Foco: alternar entre flutuantes e lado a lado
bindsym $mod+space       focus mode_toggle
#: Focar o contêiner pai
bindsym $mod+a           focus parent
#: Modo redimensionar (setas ou j/k/l/ç, Esc sai)
bindsym $mod+r mode "resize"

#:: Layout
#: Próxima janela abre ao lado (divisão horizontal)
bindsym $mod+h split h
#: Próxima janela abre embaixo (divisão vertical)
bindsym $mod+v split v
#: Layout empilhado
bindsym $mod+s layout stacking
#: Layout em abas
bindsym $mod+w layout tabbed
#: Alternar a direção da divisão
bindsym $mod+e layout toggle split

#:: Workspaces
#: Super + 1…0 | Ir pra workspace
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9
bindsym $mod+0 workspace number 10
#: Super + Shift + 1…0 | Mandar janela pra workspace
bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8
bindsym $mod+Shift+9 move container to workspace number 9
bindsym $mod+Shift+0 move container to workspace number 10
#: Super + Ctrl + ←/→ | Levar workspace pro outro monitor
bindsym $mod+Ctrl+Left  move workspace to output left
bindsym $mod+Ctrl+Right move workspace to output right
#: Guardar janela no scratchpad
bindsym $mod+Shift+minus move scratchpad
#: Mostrar/esconder o scratchpad
bindsym $mod+minus       scratchpad show

#:: Tela e sessão
#: Espelhar a tela no projetor (de novo desliga)
bindsym $mod+p exec $scripts/mirror.sh
#: Captura da tela inteira
bindsym Print      exec $scripts/screenshot.sh full
#: Captura de área (abre no swappy)
bindsym Ctrl+Print exec $scripts/screenshot.sh area
#: Captura da janela
bindsym Shift+Print exec $scripts/screenshot.sh window
#: Dispensar notificação
bindsym $mod+period       exec makoctl dismiss
#: Reabrir última notificação
bindsym $mod+Shift+period exec makoctl restore
#: Bloquear a tela
bindsym $mod+x       exec $lock
#: Recarregar o sway
bindsym $mod+Shift+c reload
#: Menu de energia (sair, suspender, desligar)
bindsym $mod+Shift+e exec $scripts/powermenu.sh

# Teclas de mídia / brilho (OSD do swayosd; --locked = funciona na tela bloqueada)
#: Teclas de mídia | Volume, microfone, brilho e player
bindsym --locked XF86AudioRaiseVolume  exec swayosd-client --output-volume raise
bindsym --locked XF86AudioLowerVolume  exec swayosd-client --output-volume lower
bindsym --locked XF86AudioMute         exec swayosd-client --output-volume mute-toggle
bindsym --locked XF86AudioMicMute      exec swayosd-client --input-volume mute-toggle
bindsym --locked XF86MonBrightnessUp   exec swayosd-client --brightness raise
bindsym --locked XF86MonBrightnessDown exec swayosd-client --brightness lower
bindsym --locked XF86AudioPlay  exec playerctl play-pause
bindsym --locked XF86AudioNext  exec playerctl next
bindsym --locked XF86AudioPrev  exec playerctl previous
bindsym --release Caps_Lock exec swayosd-client --caps-lock

# Redimensionar
mode "resize" {
    bindsym $left  resize shrink width 10px
    bindsym $down  resize grow height 10px
    bindsym $up    resize shrink height 10px
    bindsym $right resize grow width 10px
    bindsym Left   resize shrink width 10px
    bindsym Down   resize grow height 10px
    bindsym Up     resize shrink height 10px
    bindsym Right  resize grow width 10px
    bindsym Return mode "default"
    bindsym Escape mode "default"
    bindsym $mod+r mode "default"
}
