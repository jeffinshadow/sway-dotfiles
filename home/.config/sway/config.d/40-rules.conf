# ---------------------------------------------------------------
# Regras de janela
# ---------------------------------------------------------------
for_window [app_id="pavucontrol"]                floating enable, resize set 820 520
for_window [app_id="org.pulseaudio.pavucontrol"] floating enable, resize set 820 520
for_window [app_id="blueman-manager"]            floating enable, resize set 720 480
for_window [app_id="nm-connection-editor"]       floating enable
for_window [app_id="nwg-displays"]               floating enable
for_window [app_id="nwg-look"]                   floating enable
for_window [app_id="org.gnome.Calculator"]       floating enable
for_window [app_id="swappy"]                     floating enable
for_window [app_id="solaar"]                     floating enable
for_window [app_id="firewall-config"]            floating enable
for_window [app_id="system-config-printer"]      floating enable
for_window [window_role="pop-up"]                floating enable
for_window [window_role="dialog"]                floating enable
for_window [window_type="dialog"]                floating enable
for_window [title="(?:Open|Save) (?:File|Folder|As)"] floating enable
for_window [title="^(Abrir|Salvar)"]             floating enable

# Picture-in-picture (Firefox/Chromium): flutua no canto inferior direito,
# fixo em todas as workspaces. Posição: canto da área útil e volta
# tamanho + 10px (o gap). Tudo num comando: separado, o sway atropela o resize.
for_window [title="(?i)^picture[- ]in[- ]picture$"] floating enable, sticky enable, border pixel 0, resize set width 480 px height 270 px, move position 100 ppt 100 ppt, move left 490 px, move up 280 px

# Indica apps rodando via XWayland no título (útil pra caçar borrão)
for_window [shell="xwayland"] title_format "%title [X]"

# Não deixa o swayidle apagar a tela durante vídeo/apresentação em tela cheia
for_window [app_id=".*"] inhibit_idle fullscreen
for_window [class=".*"]  inhibit_idle fullscreen

# Workspace fixa por app (as duas máquinas): 1 terminal · 2 navegador ·
# 3 chat · 4 jogos. A janela nova vai pra workspace dela e o foco vai junto.
# O picture-in-picture fica de fora (ele é fixo em todas as workspaces), e o
# btop/ncdu que a barra abre usam outra classe (abrem onde se está).
set $nao_pip title="^(?!(?i:picture[- ]in[- ]picture)$)"
for_window [app_id="^com\.mitchellh\.ghostty$"]       move container to workspace number 1, focus
for_window [app_id="^firefox$" $nao_pip]              move container to workspace number 2, focus
for_window [app_id="^chromium$" $nao_pip]             move container to workspace number 3, focus
for_window [app_id="^vesktop$"]                       move container to workspace number 3, focus
for_window [class="^vesktop$"]                        move container to workspace number 3, focus
for_window [class="^steam$"]                          move container to workspace number 4, focus
for_window [class="^steam_app_"]                      move container to workspace number 4, focus
for_window [app_id="^gamescope$"]                     move container to workspace number 4, focus
