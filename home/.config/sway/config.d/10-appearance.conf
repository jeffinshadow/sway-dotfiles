# ---------------------------------------------------------------
# Aparência
# ---------------------------------------------------------------
font pango:Google Sans 10

default_border pixel 2
default_floating_border pixel 2
titlebar_padding 6 3
hide_edge_borders --i3 smart

# Tudo 10px: entre janelas (inner), janela↔borda (outer 0 + inner) e
# janela↔barra. A waybar usa margin 10 pra bater com isso.
gaps inner 10
gaps outer 0

# class                 border     background text       indicator   child_border
client.focused          $accent    $surface   $text      $accent_lt  $accent
client.focused_inactive $surface2  $base      $text_dim  $surface2   $surface2
client.unfocused        $surface   $base      $text_dim  $surface    $surface
client.urgent           $red       $red       $base      $red        $red

output * bg $wallpaper fill

seat seat0 xcursor_theme Bibata-Modern-Ice 24

# Barra (waybar) — via 'bar' pro reload do sway recarregar junto
bar {
    swaybar_command waybar
}
