# ---------------------------------------------------------------
# Variáveis
# ---------------------------------------------------------------
set $mod Mod4

# Direções no estilo do i3 antigo (j k l ç) — além das setas
set $left  j
set $down  k
set $up    l
set $right ccedilla

set $term    ghostty
set $menu    rofi -show drun
set $files   nautilus --new-window
set $browser firefox
set $lock    swaylock -f
set $scripts ~/.config/sway/scripts

# Paleta Shadow Materia
set $base      #181818
set $surface   #282828
set $surface2  #333333
set $accent    #5294e2
set $accent_lt #8ab4f8
set $text      #dedede
set $text_dim  #999999
set $red       #f28b82

set $wallpaper ~/.local/share/wallpapers/shadow-principal.png
