# ---------------------------------------------------------------
# Variáveis
# ---------------------------------------------------------------
set $mod Mod4

# Direções no estilo do i3 antigo (j k l ç) — além das setas
set $left  j
set $down  k
set $up    l
set $right ccedilla

set $term    ghostty
# Rofi liga/desliga: se já houver um aberto (ou travado), fecha em vez de
# abrir outro — o rofi só aceita uma instância por vez.
set $menu    pkill -x rofi || rofi -show drun
set $files   nautilus --new-window
set $browser firefox
set $lock    swaylock -f
set $scripts ~/.config/sway/scripts

# Paleta Shadow Materia (híbrida M3 — ver PALETA-HIBRIDA.md)
set $base       #131314
set $surface    #1A1A1C
set $surface2   #222324
set $outline    #323235
set $outline_hi #49494B
set $accent     #5294E2
set $accent_lt  #8AB8F0
set $on_accent  #0B0D10
set $text       #F0EDEE
set $text_dim   #919093
set $red        #F28B82
set $on_red     #370303

set $wallpaper ~/.local/share/wallpapers/host.png
