; Modelos do llama-server em modo roteador (llm.sh). Um carregado por vez (--models-max 1):
; escolher outro no seletor do chat descarrega o atual e carrega o novo (~10 s; pesado ~30 s).
; Medidos na RX 9050 em 22/11/2026 (build 12627, Vulkan; o desktop ocupa ~1,1 GB de VRAM).
version = 1

[*]
; comum: FA, KV q8_0, ngram-mod (4-6x ao reescrever texto/código, custo zero no resto),
; tool calling (jinja), cache de prompt na RAM limitado a 2 GB
n-gpu-layers = 99
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
spec-type = ngram-mod
cache-ram = 2048
jinja = true

; padrão: ~42 t/s, 32k, 7,1 GB de VRAM; contexto quase não pesa (atenção híbrida)
[Qwen3.5 9B]
model = /models/Qwen3.5-9B-Q4_K_M.gguf
ctx-size = 32768

; rápido: ~54 t/s em respostas curtas; cai mais com contexto longo
[Qwen3 8B rápido]
model = /models/Qwen3-8B-IQ4_XS.gguf
ctx-size = 24576

; pesado: MoE, especialistas na RAM (~17 GB em cache), ~19 t/s; o mais forte em código.
; -t 12 (HT atrapalha); NUNCA ubatch 4096 com ngram-mod (trava o servidor)
[Qwen3.6 35B pesado]
model = /models/Qwen3.6-35B-A3B-UD-IQ4_XS.gguf
ctx-size = 32768
n-cpu-moe = 32
threads = 12
batch-size = 2048
ubatch-size = 2048
