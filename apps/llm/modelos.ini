; Modelos do llama-server em modo roteador (llm.sh). Um carregado por vez (--models-max 1):
; escolher outro no chat/agente descarrega o atual e carrega o novo (~10 s; pesado ~30 s, e a
; 1ª carga depois do boot é lenta: os especialistas saem do disco).
; Medidos na RX 9050 (build 12627, Vulkan; o desktop ocupa ~1,1 GB de VRAM).
version = 1

[*]
; comum: FA, KV q8_0, ngram-mod (4-6x ao reescrever texto/código, custo zero no resto),
; tool calling (jinja), cache de prompt na RAM
n-gpu-layers = 99
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
spec-type = ngram-mod
cache-ram = 3072
jinja = true
; amostragem recomendada pela Qwen pra agente/código (o padrão do llama.cpp é top-k 40, min-p 0.05)
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.0

; padrão: rápido, lê imagens (visão na CPU: o modelo já ocupa ~7 GB de VRAM)
[Qwen3.5 9B]
model = /models/Qwen3.5-9B-Q4_K_M.gguf
mmproj = /models/mmproj-Qwen3.5-9B-F16.gguf
no-mmproj-offload = true
image-max-tokens = 1024
ctx-size = 49152

; rápido: respostas curtas, sem visão
[Qwen3 8B rápido]
model = /models/Qwen3-8B-IQ4_XS.gguf
ctx-size = 24576

; agente: MoE com especialistas na RAM, o melhor em código (SWE-bench V 73,4); 64k + visão.
; -t 12 (HT atrapalha); NUNCA ubatch 4096 com ngram-mod (trava o servidor)
[Qwen3.6 35B pesado]
model = /models/Qwen3.6-35B-A3B-UD-IQ4_XS.gguf
mmproj = /models/mmproj-Qwen3.6-35B-A3B-Q8_0.gguf
image-max-tokens = 1280
ctx-size = 65536
n-cpu-moe = 36
threads = 12
batch-size = 2048
ubatch-size = 2048
