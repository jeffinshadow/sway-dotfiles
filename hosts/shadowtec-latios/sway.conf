# shadowtec-latios — Dell Latitude 7280 (12.5" FHD, escala 1.0)

# Tela interna em escala 1.0; o tamanho vem das fontes (text-scaling-factor 1.1)
output eDP-1 mode 1920x1080 scale 1.0

# Tema GTK via gsettings (escala de texto 1.1, padrão das duas máquinas)
exec_always ~/.config/sway/scripts/gtk-settings.sh

# LG 24MS500 (o monitor da giratina, pelo KVM): o EDID não diz a ordem dos
# subpixels e o sway usa cinza no texto dele. O kanshi não tem essa opção;
# pelo identificador ela vale toda vez que o monitor conecta.
output "LG Electronics LG FHD 0x00072E48" subpixel rgb

# Monitores externos/projetor: perfis do kanshi (~/.config/kanshi/config)
exec kanshi
exec_always kanshictl reload

# A tela interna só desliga com a TAMPA FECHADA e monitor externo ligado
# (uso "docado"). Com a tampa aberta ela fica ativa: estendida à direita
# ou espelhada (Super+p). Sem monitor externo, tampa fechada = suspende.
bindswitch --reload --locked lid:on  output eDP-1 disable
bindswitch --reload --locked lid:off output eDP-1 enable

# Suspende após 15 min parado, só na bateria: na tomada fica ligado
# (downloads, SSH, builds longos). O swayidle principal já bloqueou antes.
exec swayidle -w timeout 900 'grep -qx 1 /sys/class/power_supply/AC/online || systemctl suspend'
