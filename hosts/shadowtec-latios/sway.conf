# shadowtec-latios — Dell Latitude 7280 (12.5" FHD, escala 1.0)

# Tela interna em escala 1.0; o tamanho vem das fontes (text-scaling-factor)
output eDP-1 mode 1920x1080 scale 1.0

# Texto maior em todos os apps GTK (o gtk-settings.sh lê essa variável)
exec_always env SHADOW_TEXT_SCALE=1.15 ~/.config/sway/scripts/gtk-settings.sh

# Monitores externos/projetor: perfis do kanshi (~/.config/kanshi/config)
exec kanshi
exec_always kanshictl reload

# A tela interna só desliga com a TAMPA FECHADA e monitor externo ligado
# (uso "docado"). Com a tampa aberta ela fica ativa: estendida à direita
# ou espelhada (Super+p). Sem monitor externo, tampa fechada = suspende.
bindswitch --reload --locked lid:on  output eDP-1 disable
bindswitch --reload --locked lid:off output eDP-1 enable

# Suspende após 15 min parado (o swayidle principal já bloqueou antes)
exec swayidle -w timeout 900 'systemctl suspend'
