# shadowtec-giratina — desktop/servidor (Xeon + RX 580), ligado 24/7
# Monitor: LG 24MS500 (24" 1080p, 100 Hz) pelo HDMI, atrás de um KVM.

# 100 Hz fixo (sozinho o sway pode escolher 60). Sem adaptive sync: o
# monitor não anuncia FreeSync pelo HDMI.
output HDMI-A-1 mode 1920x1080@100Hz position 0,0 scale 1.0 adaptive_sync off

# KVM: quando ele troca pro notebook, o HDMI some e o sway guarda as
# workspaces numa saída virtual; quando volta, a config acima é reaplicada
# e as janelas voltam pro lugar. Nada a fazer aqui.

input type:pointer {
    accel_profile flat
}

# Tema GTK via gsettings (escala de texto 1.0)
exec_always ~/.config/sway/scripts/gtk-settings.sh

# Sem suspensão: é servidor (o deploy mascara os alvos de sleep). O
# swayidle principal só bloqueia e apaga a tela.
