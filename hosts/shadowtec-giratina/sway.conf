# shadowtec-giratina — desktop/servidor (Xeon + RX 9050), ligado 24/7
# Dois monitores, mesma densidade (~92 PPI), escala 1.0 nos dois:
#  - principal: LG UltraGear 32" QHD (2560x1440, 165 Hz) pelo DisplayPort;
#  - à esquerda: LG 24" FHD (1920x1080, 100 Hz) pelo HDMI, em retrato.
# Por nome do conector: se trocar os cabos de porta, ajustar aqui.

# 32": pelo DP o EDID dá 165 Hz (pelo HDMI parava em 144). Modo fixo porque
# pelo HDMI o "preferido" era um 4K falso. FreeSync (48-165 Hz) ligado
# (Super+Shift+a liga/desliga, se piscar no desktop). O EDID não diz a ordem
# dos subpixels; assumido RGB.
# Fica 444 px abaixo do topo do 24" em pé: a base da imagem do 24" fica
# ~1 cm (36 px a 92 PPI) abaixo da do 32", que tem borda inferior mais
# grossa (1920 - 36 - 1440).
output DP-1 mode 2560x1440@165Hz position 1080 444 scale 1.0 adaptive_sync on subpixel rgb

# 24" em retrato: 1080x1920 depois de girar (270 é o que bate com o lado
# pra onde ele foi girado; 90 deixa a imagem de cabeça pra baixo).
output HDMI-A-1 mode 1920x1080@100Hz transform 270 position 0 0 scale 1.0

# O sway não tem "monitor principal": a workspace 1 nasce no 32" e o foco
# começa nele. As demais vão pra tela em foco quando são criadas.
workspace 1 output DP-1 HDMI-A-1
exec swaymsg focus output DP-1

#:: Monitor
#: FreeSync (adaptive sync): liga/desliga
bindsym $mod+Shift+a exec ~/.config/sway/scripts/freesync.sh

# Se uma tela some (desligada, KVM), o sway leva as workspaces dela pra
# outra; quando volta, a config acima é reaplicada. Nada a fazer aqui.

input type:pointer {
    accel_profile flat
}

# Tema GTK via gsettings (escala de texto 1.1)
exec_always ~/.config/sway/scripts/gtk-settings.sh

# Sem suspensão: é servidor (o deploy mascara os alvos de sleep). O
# swayidle principal só bloqueia e apaga a tela.
