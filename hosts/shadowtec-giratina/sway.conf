# shadowtec-giratina — desktop/servidor (Xeon + RX 580), ligado 24/7
# Monitor: LG UltraGear 32" QHD (2560x1440, 144 Hz) pelo HDMI, atrás de um KVM.

# Modo fixo: o modo "preferido" do EDID pelo HDMI é um 4K falso, não o
# nativo. Sem a taxa, o sway usa a mais alta do 1440p (144 Hz). Escala 1.0:
# a densidade (~92 PPI) é a mesma do 24" 1080p antigo, então fontes e barra
# ficam do mesmo tamanho físico. O monitor anuncia FreeSync (48-144 Hz):
# adaptive sync ligado (Super+Shift+a liga/desliga, se piscar no desktop).
# O EDID não diz a ordem dos subpixels (o sway mostra "unknown"); assumido RGB.
output HDMI-A-1 mode 2560x1440 position 0,0 scale 1.0 adaptive_sync on subpixel rgb

#:: Monitor
#: FreeSync (adaptive sync): liga/desliga
bindsym $mod+Shift+a exec ~/.config/sway/scripts/freesync.sh

# KVM: quando ele troca pro notebook, o HDMI some e o sway guarda as
# workspaces numa saída virtual; quando volta, a config acima é reaplicada
# e as janelas voltam pro lugar. Nada a fazer aqui.

input type:pointer {
    accel_profile flat
}

# Tema GTK via gsettings (escala de texto 1.1)
exec_always ~/.config/sway/scripts/gtk-settings.sh

# Sem suspensão: é servidor (o deploy mascara os alvos de sleep). O
# swayidle principal só bloqueia e apaga a tela.
