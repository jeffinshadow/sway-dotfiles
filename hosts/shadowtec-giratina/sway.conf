# shadowtec-giratina — desktop/servidor (Xeon + RX 580)
# Sem suspensão automática (é servidor). Ajuste os monitores aqui:
#   swaymsg -t get_outputs   → nomes reais das saídas
# output DP-1      mode 1920x1080 position 0,0
# output HDMI-A-1  mode 1920x1080 position 1920,0
# output HDMI-A-1  bg ~/.local/share/wallpapers/shadow-secundario.png fill

input type:pointer {
    accel_profile flat
}

# Tema GTK via gsettings (escala de texto 1.0)
exec_always ~/.config/sway/scripts/gtk-settings.sh
